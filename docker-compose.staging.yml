# AutoTele SaaS - Staging Environment Docker Compose
services:
  staging_fastapi_api:
    image: new_bot-fastapi_api:latest
    container_name: staging_fastapi_api
    volumes:
      - ./main_api.py:/app/main_api.py:ro
      - ./db_manager.py:/app/db_manager.py:ro
      - ./cache_manager.py:/app/cache_manager.py:ro
    command: uvicorn main_api:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8005:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:local_secure_password_2026@postgres_db:5432/ad_exchange_staging
      - REDIS_URL=redis://redis_cache:6379/1
      - JWT_SECRET=SUPER_SECRET_SaaS_KEY_2026_PRODUCTION_SECURE_RANDOM_XYZ
      - SESSION_ENCRYPTION_KEY=LsdLM10kc3tb-peVR8gNacGaBH9_6njN7FI9uMjneXA=
      - CORS_ALLOWED_ORIGINS=https://staging.telegauto.com,http://167.233.246.102:3005,https://telegauto.com,http://localhost:3000
      - FRONTEND_URL=http://167.233.246.102:3005
      - PYTHONUNBUFFERED=1
      - STATUS_BOT_TOKEN=8968164888:AAEplQ75k9J0gsxrghqlbD5z9-v84wrJ2L0
      - STATUS_BOT_USERNAME=AutoTeleStatusBot
      - PROXY_POOL=[]
      - DEFAULT_PROXY_PORT=50101
    networks:
      - teleauto_internal_network
    restart: always
    mem_limit: 256m
    mem_reservation: 96m
    tmpfs:
      - /tmp

  staging_core_worker:
    image: new_bot-core_worker:latest
    container_name: staging_core_worker
    command: python worker.py
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:local_secure_password_2026@postgres_db:5432/ad_exchange_staging
      - REDIS_URL=redis://redis_cache:6379/1
      - SESSION_ENCRYPTION_KEY=LsdLM10kc3tb-peVR8gNacGaBH9_6njN7FI9uMjneXA=
      - PYTHONUNBUFFERED=1
      - STATUS_BOT_TOKEN=8968164888:AAEplQ75k9J0gsxrghqlbD5z9-v84wrJ2L0
      - STATUS_BOT_USERNAME=AutoTeleStatusBot
    volumes:
      - ./worker.py:/app/worker.py:ro
      - ./db_manager.py:/app/db_manager.py:ro
      - ./cache_manager.py:/app/cache_manager.py:ro
    networks:
      - teleauto_internal_network
    restart: always
    mem_limit: 384m
    mem_reservation: 128m
    tmpfs:
      - /tmp

  staging_frontend:
    image: nginx:alpine
    container_name: staging_frontend
    ports:
      - "0.0.0.0:3005:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/default.staging.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - teleauto_internal_network
    restart: always
    mem_limit: 64m
    mem_reservation: 16m

networks:
  teleauto_internal_network:
    external: true
    name: new_bot_teleauto_internal_network
