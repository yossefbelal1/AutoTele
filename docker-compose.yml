# AutoTele SaaS - Hardened Production Docker Compose
# Architecture: Internal Network Isolation with Environment-Driven Secrets

services:
  # 1. PostgreSQL Database Service
  postgres_db:
    image: postgres:15-alpine
    container_name: saas_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env file}
      POSTGRES_DB: ${POSTGRES_DB:-ad_exchange}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    command: >
      postgres
      -c shared_buffers=48MB
      -c effective_cache_size=64MB
      -c work_mem=2MB
      -c maintenance_work_mem=16MB
      -c max_connections=200
      -c wal_buffers=2MB
      -c checkpoint_completion_target=0.9
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c synchronous_commit=off
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Bind to localhost only for admin management; not exposed to public internet
    ports:
      - "127.0.0.1:5433:5432"
    networks:
      - teleauto_internal_network
    restart: always
    mem_limit: 256m
    mem_reservation: 96m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Messaging Service
  redis_cache:
    image: redis:7-alpine
    container_name: saas_redis
    command: >
      redis-server
      --appendonly yes
      --maxmemory 48mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
    # Bind to localhost only for debugging; not exposed to public internet
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - teleauto_internal_network
    restart: always
    mem_limit: 128m
    mem_reservation: 48m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 3. FastAPI Application Backend
  fastapi_api:
    build: .
    container_name: saas_fastapi_api
    volumes:
      - ./main_api.py:/app/main_api.py:ro
      - ./db_manager.py:/app/db_manager.py:ro
      - ./cache_manager.py:/app/cache_manager.py:ro
    command: uvicorn main_api:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required in .env file}
      - REDIS_URL=${REDIS_URL:-redis://redis_cache:6379/0}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required. Set it in .env file.}
      - SESSION_ENCRYPTION_KEY=${SESSION_ENCRYPTION_KEY:?SESSION_ENCRYPTION_KEY is required. Set it in .env file.}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://telegauto.com,https://www.telegauto.com,https://teleauto.com,https://www.teleauto.com}
      - FRONTEND_URL=${FRONTEND_URL:-https://telegauto.com}
      - PYTHONUNBUFFERED=1
      - STATUS_BOT_TOKEN=${STATUS_BOT_TOKEN:-}
      - STATUS_BOT_USERNAME=${STATUS_BOT_USERNAME:-AutoTeleStatusBot}
      - PROXY_POOL=${PROXY_POOL:-[]}
      - DEFAULT_PROXY_PORT=${DEFAULT_PROXY_PORT:-50101}
      - DEFAULT_PROXY_USERNAME=${DEFAULT_PROXY_USERNAME:-}
      - DEFAULT_PROXY_PASSWORD=${DEFAULT_PROXY_PASSWORD:-}
    depends_on:
      postgres_db:
        condition: service_healthy
      redis_cache:
        condition: service_started
    networks:
      - teleauto_internal_network
    restart: always
    mem_limit: 256m
    mem_reservation: 96m
    tmpfs:
      - /tmp
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 4. Core Worker Engine
  core_worker:
    build: .
    container_name: saas_core_worker
    command: python worker.py
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required in .env file}
      - REDIS_URL=${REDIS_URL:-redis://redis_cache:6379/0}
      - SESSION_ENCRYPTION_KEY=${SESSION_ENCRYPTION_KEY:?SESSION_ENCRYPTION_KEY is required. Set it in .env file.}
      - PYTHONUNBUFFERED=1
      - STATUS_BOT_TOKEN=${STATUS_BOT_TOKEN:-}
      - STATUS_BOT_USERNAME=${STATUS_BOT_USERNAME:-AutoTeleStatusBot}
    depends_on:
      postgres_db:
        condition: service_healthy
      redis_cache:
        condition: service_started
    volumes:
      - ./worker.py:/app/worker.py:ro
      - ./db_manager.py:/app/db_manager.py:ro
      - ./cache_manager.py:/app/cache_manager.py:ro
    networks:
      - teleauto_internal_network
    restart: always
    mem_limit: 512m
    mem_reservation: 128m
    tmpfs:
      - /tmp
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 5. Frontend Static Nginx UI & Reverse Proxy
  frontend_ui:
    image: nginx:alpine
    container_name: saas_frontend
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - teleauto_internal_network
    restart: always
    mem_limit: 64m
    mem_reservation: 16m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  teleauto_internal_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
