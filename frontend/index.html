<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>AutoTele | المحرك السحابي لأتمتة التليجرام</title>
  <meta name="description" content="أتمتة وإدارة قنوات التليجرام 24/7 — نشر تلقائي، مسح ذكي، حملات مجدولة سحابية.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200;300;400;600;700;900&family=Outfit:wght@100;300;400;600;900&family=Tajawal:wght@300;400;700;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS v3 CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Cairo', 'Tajawal', 'sans-serif'],
            outfit: ['Outfit', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- React & ReactDOM UMD -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Framer Motion UMD -->
  <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js" crossorigin></script>

  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    Babel.registerPreset("react-classic", {
      presets: [
        [Babel.availablePresets["react"], { runtime: "classic" }]
      ]
    });
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: #020d1f;
      color: #e8f0ff;
      font-family: 'Cairo', 'Tajawal', sans-serif;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
    }

    /* Blue electric scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #010a18; }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #0066ff, #003dbb);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover { background: #0088ff; }

    /* Loading screen */
    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 99999;
      perspective: 1200px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      pointer-events: all;
    }

    .loader-panel {
      position: absolute;
      top: 0;
      height: 100%;
      width: 50%;
      background: #020d1f;
      background-image: 
        radial-gradient(circle at 100% 50%, rgba(0, 40, 120, 0.15), transparent 60%),
        radial-gradient(circle at 0% 50%, rgba(0, 40, 120, 0.15), transparent 60%);
      transition: transform 1.2s cubic-bezier(0.76, 0, 0.24, 1);
      box-sizing: border-box;
      z-index: 1;
    }

    .panel-left {
      left: 0;
      transform-origin: left center;
      border-right: 1px solid rgba(0, 150, 255, 0.08);
    }

    .panel-right {
      right: 0;
      transform-origin: right center;
      border-left: 1px solid rgba(0, 150, 255, 0.08);
    }

    /* Swing open like double doors / book */
    #loading-screen.opened .panel-left {
      transform: rotateY(-95deg);
    }

    #loading-screen.opened .panel-right {
      transform: rotateY(95deg);
    }

    .loader-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      transition: all 0.7s cubic-bezier(0.76, 0, 0.24, 1);
      text-align: center;
      cursor: pointer;
      user-select: none;
    }

    #loading-screen.opened .loader-content {
      opacity: 0;
      transform: scale(0.7) translateZ(-150px);
      pointer-events: none;
    }

    .loader-panel::before {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
        linear-gradient(90deg, rgba(0, 200, 255, 0.04), rgba(0, 255, 0, 0.01), rgba(0, 100, 255, 0.04));
      background-size: 100% 4px, 6px 100%;
      opacity: 0.65;
      pointer-events: none;
    }

    /* Glitch Logo Container */
    .glitch-wrapper {
      position: relative;
      width: 380px;
      height: 380px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: scale(0.5);
      opacity: 0;
      animation: glitch-entrance 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes glitch-entrance {
      0% {
        transform: scale(0.3) rotate(-15deg);
        opacity: 0;
      }
      65% {
        transform: scale(1.15) rotate(6deg);
        filter: hue-rotate(90deg) saturate(1.8);
      }
      85% {
        transform: scale(0.95) rotate(-2deg);
      }
      100% {
        transform: scale(1.0) rotate(0deg);
        opacity: 1;
      }
    }

    .glitch-img {
      position: absolute;
      width: 360px;
      height: 360px;
      object-fit: contain;
      filter: drop-shadow(0 0 35px rgba(0, 180, 255, 0.45));
      user-select: none;
      pointer-events: none;
    }

    /* Main image stays in the center */
    .main-img {
      z-index: 3;
      animation: main-glitch 6.5s infinite step-end;
    }

    /* Clone 1: Red/Cyan Shift */
    .clone-1 {
      z-index: 2;
      left: 3px;
      filter: drop-shadow(-4px 0 0 #ff0055) opacity(0.85);
      animation: glitch-anim-1 3.5s infinite linear alternate-reverse;
    }

    /* Clone 2: Cyan/Blue Shift */
    .clone-2 {
      z-index: 1;
      left: -3px;
      filter: drop-shadow(4px 0 0 #00ffff) opacity(0.85);
      animation: glitch-anim-2 2.5s infinite linear alternate-reverse;
    }

    /* Glitch Keyframes */
    @keyframes main-glitch {
      0%, 94%, 100% { transform: translate(0, 0) skew(0deg); }
      95% { transform: translate(-4px, 2px) skew(-3deg); }
      96% { transform: translate(4px, -2px) skew(3deg); }
      97% { transform: translate(-2px, -3px) skew(-1deg); }
      98% { transform: translate(3px, 3px) skew(2deg); }
      99% { transform: translate(-1px, 1px) skew(0deg); }
    }

    @keyframes glitch-anim-1 {
      0% {
        clip-path: inset(35% 0 60% 0);
        transform: skew(-4deg);
      }
      20% {
        clip-path: inset(88% 0 1% 0);
        transform: skew(1deg);
      }
      40% {
        clip-path: inset(20% 0 55% 0);
        transform: skew(-2deg);
      }
      60% {
        clip-path: inset(70% 0 8% 0);
        transform: skew(4deg);
      }
      80% {
        clip-path: inset(10% 0 78% 0);
        transform: skew(-3deg);
      }
      100% {
        clip-path: inset(85% 0 3% 0);
        transform: skew(3deg);
      }
    }

    @keyframes glitch-anim-2 {
      0% {
        clip-path: inset(10% 0 82% 0);
        transform: skew(3deg);
      }
      20% {
        clip-path: inset(50% 0 35% 0);
        transform: skew(-3deg);
      }
      40% {
        clip-path: inset(80% 0 4% 0);
        transform: skew(4deg);
      }
      60% {
        clip-path: inset(25% 0 62% 0);
        transform: skew(-2deg);
      }
      80% {
        clip-path: inset(60% 0 18% 0);
        transform: skew(2deg);
      }
      100% {
        clip-path: inset(3% 0 90% 0);
        transform: skew(-4deg);
      }
    }

    .loader-brand {
      font-family: 'Cairo', sans-serif;
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 4px;
      color: #fff;
      text-shadow: 0 0 15px rgba(0, 200, 255, 0.3);
      opacity: 0;
      transform: translateY(15px);
      animation: slide-up 0.7s 0.3s ease forwards;
    }

    .loader-hint {
      font-family: 'Cairo', sans-serif;
      font-size: 10px;
      color: rgba(0, 200, 255, 0.45);
      letter-spacing: 1px;
      opacity: 0;
      animation: fade-in 0.8s 0.8s ease forwards;
      margin-top: 5px;
    }

    .progress-bar-container {
      width: 150px;
      height: 3px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #0055ff, #00c8ff);
      box-shadow: 0 0 8px #00c8ff;
      animation: load-progress 3.5s cubic-bezier(0.1, 0.8, 0.2, 1) forwards;
    }

    @keyframes load-progress {
      to { width: 100%; }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes slide-up {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fade-in {
      to { opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Loading Screen -->
  <div id="loading-screen" onclick="window.triggerOpen?.()">
    <div class="loader-panel panel-left"></div>
    <div class="loader-panel panel-right"></div>
    
    <div class="loader-content">
      <div class="glitch-wrapper">
        <img src="logo.png" alt="AutoTele Logo" class="glitch-img main-img">
        <img src="logo.png" alt="AutoTele Logo" class="glitch-img clone-1">
        <img src="logo.png" alt="AutoTele Logo" class="glitch-img clone-2">
      </div>
      <div class="loader-brand">AUTOTELE</div>
      <div class="progress-bar-container">
        <div class="progress-bar-fill"></div>
      </div>
      <div class="loader-hint">انقر لتخطي الرسوم المتحركة • Click to skip</div>
    </div>
  </div>

  <script>
    window.opened = false;
    window.triggerOpen = function() {
      if (window.opened) return;
      window.opened = true;
      const loader = document.getElementById('loading-screen');
      if (loader) {
        loader.classList.add('opened');
        // Let it click through
        loader.style.pointerEvents = 'none';
        setTimeout(() => {
          loader.style.display = 'none';
        }, 1200);
      }
    };

    // Auto open after 4.2 seconds if user hasn't clicked
    setTimeout(() => {
      window.triggerOpen();
    }, 4200);
  </script>

  <!-- React Mount Point -->
  <div id="landing-root"></div>

  <!-- Landing Page Component -->
  <script type="text/babel" data-presets="react-classic" src="landing_motion.js?v=4.5"></script>

</body>
</html>
