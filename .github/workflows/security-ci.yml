name: AutoTele Security & CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  code-security-and-lint:
    name: Code Quality, Syntax & Security Scan
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_ad_exchange
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install bandit flake8 pytest pytest-asyncio

    - name: Validate Python Syntax & Bytecode Compilation
      run: |
        python -m py_compile main_api.py worker.py db_manager.py cache_manager.py status_bot.py

    - name: Security Static Analysis (Bandit)
      run: |
        # Scan for high/medium severity vulnerabilities (excluding non-crypto backoff jitter B311, urllib B310)
        bandit -r main_api.py worker.py db_manager.py cache_manager.py -ll -s B311,B113,B310

    - name: Verify No Secrets in Version Control
      run: |
        # Ensure no real .env files are tracked
        if [ -f ".env" ]; then
          echo "ERROR: .env file found in repository!"
          exit 1
        fi
        echo "Clean repository check passed."

    - name: Run Test Suite
      env:
        DATABASE_URL: "postgresql+asyncpg://postgres:test@localhost:5432/test_ad_exchange"
        REDIS_URL: "redis://localhost:6379/0"
        JWT_SECRET: "ci_testing_secret_key_must_be_over_32_characters_long_abcdef"
        SESSION_ENCRYPTION_KEY: "MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE="
      run: |
        python -m pytest tests/ --ignore=tests/test_campaign_dynamic_links_remote.py --ignore=tests/test_reply_long_message_remote.py --ignore=tests/test_acc_conn.py --ignore=tests/test_session.py

  docker-build-validate:
    name: Dockerfile Build Validation
    runs-on: ubuntu-latest
    needs: code-security-and-lint

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image (Dry Run)
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: teleauto-core:latest
